name: Sync Release Artifacts to JFrog

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to sync (defaults to github.event.release.tag_name)'
        required: false
        type: string
      debian_repo:
        description: 'JFrog Debian repository name'
        required: false
        type: string
        default: 'omp-debian-release-local'
      rpm_repo:
        description: 'JFrog RPM repository name'
        required: false
        type: string
        default: 'omp-rpm-release-local'        
      binaries_repo:
        description: 'JFrog Generic binaries repository name'
        required: false
        type: string
        default: 'omp-binaries-release-local'
      docker_repo:
        description: 'JFrog Docker repository name'
        required: false
        type: string
        default: 'omp-docker-release-local'
    secrets:
      JF_ACCESS_TOKEN:
        required: true
      JF_USER:
        required: false
      JF_URL:
        required: false

jobs:
  # JOB 1: Handles all s390x file attachments (*.tar.gz, *.deb, *.rpm)
  move-file-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve Release Tag
        id: vars
        run: |
          TAG="${{ inputs.tag_name || github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::Release tag could not be determined. Pass tag_name input or run on release event."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Operating on Release Tag: $TAG in repository: ${{ github.repository }}"

      - name: Fetch GitHub Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloads
          gh release download "${{ steps.vars.outputs.tag }}" --repo "${{ github.repository }}" --dir ./downloads || echo "No release assets found to download."

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        env:
          JF_URL: ${{ secrets.JF_URL || 'https://linuxfoundation.jfrog.io' }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      # Step 3a: Upload Debian packages
      - name: Upload Debian Packages (s390x)
        run: |
          if compgen -G "./downloads/*.deb" > /dev/null; then
            echo "Found .deb packages. Uploading to ${{ inputs.debian_repo }}..."
            jfrog rt upload "./downloads/*.deb" "${{ inputs.debian_repo }}/${{ steps.vars.outputs.tag }}/" \
              --flat=true \
              --target-props="deb.distribution=stable;deb.component=main;deb.architecture=s390x" \
              --build-name="gh-release-sync-${{ github.event.repository.name }}" \
              --build-number="${{ github.run_number }}"
          else
            echo "No .deb packages found, skipping."
          fi

      # Step 3b: Upload RPM packages
      - name: Upload RPM Packages
        run: |
          if compgen -G "./downloads/*.rpm" > /dev/null; then
            echo "Found .rpm packages. Uploading to ${{ inputs.rpm_repo }}..."
            jfrog rt upload "./downloads/*.rpm" "${{ inputs.rpm_repo }}/${{ steps.vars.outputs.tag }}/" \
              --flat=true \
              --build-name="gh-release-sync-${{ github.event.repository.name }}" \
              --build-number="${{ github.run_number }}"
          else
            echo "No .rpm packages found, skipping."
          fi

      # Step 3c: Upload Generic files (*.tar.gz, *.zip, etc.)
      - name: Upload Generic Tarballs
        run: |
          shopt -s extglob nullglob
          generic_files=(./downloads/!(*.deb|*.rpm|*.md5|*.sha1|*.sha256|*.container.tar))
          if [ ${#generic_files[@]} -gt 0 ]; then
            echo "Found generic assets. Uploading to ${{ inputs.binaries_repo }}..."
            jfrog rt upload "./downloads/*" "${{ inputs.binaries_repo }}/${{ steps.vars.outputs.tag }}/" \
              --flat=true \
              --exclusions="*.deb;*.rpm;*.md5;*.sha1;*.sha256;*.container.tar" \
              --build-name="gh-release-sync-${{ github.event.repository.name }}" \
              --build-number="${{ github.run_number }}"
          else
            echo "No generic assets found, skipping."
          fi

  # JOB 2: Handles the s390x container images using Skopeo (Optional)
  move-container-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Discover and Copy Container Image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || github.event.release.tag_name }}"
          [ -z "$TAG" ] && { echo "No release tag found, skipping image copy."; exit 0; }

          CANDIDATES=("${{ github.repository }}")

          # Safely query GHCR for any linked container package names
          DISCOVERED=$(gh api "/orgs/${{ github.repository_owner }}/packages" \
            -F package_type=container \
            --jq ".[] | select(.repository.full_name == \"${{ github.repository }}\") | .name" 2>/dev/null || true)

          # Append discovered package paths if response is valid (not JSON error)
          if [ -n "$DISCOVERED" ] && [[ ! "$DISCOVERED" =~ ^\{ ]]; then
            while IFS= read -r pkg; do
              [ -n "$pkg" ] && CANDIDATES+=("${{ github.repository_owner }}/$pkg")
            done <<< "$DISCOVERED"
          fi

          # Deduplicate candidates
          UNIQUE_CANDIDATES=($(printf "%s\n" "${CANDIDATES[@]}" | sort -u))

          for image_path in "${UNIQUE_CANDIDATES[@]}"; do
            APP_NAME="$(basename "$image_path")"

            # Probe tag without 'v' (e.g. 3.9.3) and with 'v' (e.g. v3.9.3)
            for t in "${TAG#v}" "$TAG"; do
              SRC="docker://ghcr.io/${image_path}:${t}"
              DEST="docker://linuxfoundation.jfrog.io/${{ inputs.docker_repo }}/${APP_NAME}:${t}"

              echo "Checking $SRC..."
              if skopeo inspect --creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "$SRC" >/dev/null 2>&1; then
                echo "Found image at $SRC. Copying to $DEST..."
                skopeo copy \
                  --src-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
                  --dest-creds="${{ secrets.JF_USER }}:${{ secrets.JF_ACCESS_TOKEN }}" \
                  "$SRC" "$DEST"
                break 2
              fi
            done
          done
